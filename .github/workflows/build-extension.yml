name: Build Extension

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build Browser Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create env.js from example
        run: cp src/utils/env.example.js src/utils/env.js

      - name: Build extension
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Verify build output
        run: |
          echo "Build directory contents:"
          ls -la build/
          echo ""
          echo "Manifest version:"
          cat build/manifest.json | grep "manifest_version"

      - name: Create extension ZIP
        run: |
          cd build
          zip -r ../nauta-connect-v${{ github.run_number }}.zip .
          cd ..
          echo "Extension packaged successfully"
          ls -lh nauta-connect-v${{ github.run_number }}.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nauta-connect-extension
          path: nauta-connect-v${{ github.run_number }}.zip
          retention-days: 30

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build-directory
          path: build/
          retention-days: 7

      - name: Comment PR with artifact link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runNumber = context.runNumber;
            const runId = context.runId;
            const comment = `## 📦 Extension Build Ready!

            La extensión se ha compilado exitosamente y está lista para probar.

            ### 🎯 Cómo probar:

            1. **Descargar la extensión:**
               - Ve a [Artifacts de este workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})
               - Descarga \`nauta-connect-extension.zip\`
               - Descomprime el archivo

            2. **Instalar en Chrome/Edge:**
               - Abre \`chrome://extensions/\` (o \`edge://extensions/\`)
               - Activa "Modo de desarrollador"
               - Click en "Cargar extensión sin empaquetar"
               - Selecciona la carpeta descomprimida

            3. **Instalar en Firefox:**
               - Abre \`about:debugging#/runtime/this-firefox\`
               - Click en "Cargar complemento temporal"
               - Selecciona el archivo \`manifest.json\` de la carpeta descomprimida

            ### ✅ Manifest V3
            - Versión compilada: **v${runNumber}**
            - Manifest Version: **3**
            - Compatible con Chrome 88+, Edge 88+, Firefox 109+

            ---
            **Nota:** Los artifacts se mantendrán disponibles por 30 días.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
