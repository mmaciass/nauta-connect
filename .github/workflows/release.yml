name: Release Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v2.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run type-check

      - name: Build extension
        run: npm run build

      - name: Create extension package
        run: |
          cd dist
          zip -r ../nauta-connect-v2.0.zip .
          cd ..

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Nauta Connect ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Nauta Connect v2.0

            ### ✨ Características
            - ✅ Manifest V3 - Latest Chrome extension standard
            - ✅ TypeScript 5.9 con strict mode
            - ✅ React 19.2 - Última versión
            - ✅ Vite 7.2 - Build rápido
            - ✅ Material UI 7 - UI moderna
            - ✅ 0 vulnerabilidades

            ### 📦 Instalación
            1. Descargar `nauta-connect-v2.0.zip` más abajo
            2. Descomprimir el archivo
            3. Abrir `chrome://extensions/` en Chrome
            4. Activar "Developer mode"
            5. Click "Load unpacked"
            6. Seleccionar la carpeta descomprimida

            ### 🎯 Funcionalidades v2.0
            - ⏰ Auto-refresh de sesión cada 1 minuto
            - 👤 Autocomplete de usuarios guardados
            - 🎨 Theme switcher (Light/Dark/Auto)
            - 🛡️ Error boundaries
            - 📊 Clean Architecture
            - 🔒 Type-safe con TypeScript

            ### 📄 Documentación
            Ver archivos `PHASE_*.md` para detalles de implementación.
          files: |
            nauta-connect-v2.0.zip
          draft: false
          prerelease: false
